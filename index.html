<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うぱくんのおみくじ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 12px;
    background:
        radial-gradient(circle at 10% 10%, #ffe4e8 0, transparent 28%),
        radial-gradient(circle at 90% 90%, #dcecff 0, transparent 30%),
        #fff8ed;
    color: #443b48;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
}

.container {
    max-width: 680px;
    margin: auto;
    padding: 28px 22px;
    background: #fffdf9;
    border: 3px solid #e9a0b9;
    border-radius: 28px;
    box-shadow: 0 8px 25px rgba(190, 120, 150, 0.15);
    text-align: center;
}

.logo {
    width: 115px;
    max-width: 40%;
}

h1 {
    color: #d85e91;
    font-size: 29px;
    margin: 12px 0;
}

.intro {
    background: #fff0f5;
    border-radius: 18px;
    padding: 15px;
    line-height: 1.8;
    margin: 20px 0;
}

.mascot {
    width: 210px;
    max-width: 75%;
    display: block;
    margin: 15px auto;
}


button {
    border: none;
    border-radius: 30px;
    padding: 15px 35px;
    background: linear-gradient(135deg, #f28caf, #df5d91);
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(220, 90, 140, 0.25);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
}

/* マウスを乗せたとき */
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 15px rgba(220, 90, 140, 0.3);
}

/* ボタンを押したとき */
button:active {
    transform: translateY(4px) scale(0.96);
    box-shadow: 0 1px 4px rgba(220, 90, 140, 0.2);
}

button:disabled {
    background: #c9b8c0;
    cursor: not-allowed;
    transform: none;
}

#result {
    display: none;
    margin-top: 30px;
    padding: 20px 14px;
    background: #fffaf2;
    border: 2px dashed #e9a0b9;
    border-radius: 22px;
}

.number {
    color: #9c8290;
    font-size: 14px;
    margin-bottom: 8px;
}

.fortune {
    color: #d85e91;
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0 20px;
}

.section-title {
    color: #d85e91;
    font-size: 21px;
    margin: 25px 0 12px;
}

.message {
    background: #fff0f5;
    border-radius: 15px;
    padding: 17px;
    line-height: 1.8;
    font-size: 17px;
}

.advice-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    text-align: left;
}

.advice-card {
    background: white;
    border: 1px solid #f0c6d5;
    border-radius: 14px;
    padding: 12px;
    min-width: 0;
}

.advice-card h3 {
    color: #d85e91;
    font-size: 15px;
    margin: 0 0 8px;
}

.advice-card p {
    font-size: 14px;
    line-height: 1.7;
    margin: 0;
    overflow-wrap: anywhere;
}

.lucky-area {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.lucky-card {
    background: #fff0f5;
    border-radius: 15px;
    padding: 14px 8px;
}

.lucky-card h3 {
    color: #d85e91;
    font-size: 15px;
    margin: 0 0 10px;
}

.color-swatch {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    border: 1px solid #ddd;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
}

.last-message {
    background: #ffe8f0;
    border-radius: 18px;
    padding: 15px;
    margin-top: 25px;
}

.last-message h3 {
    color: #d85e91;
    margin-top: 0;
}

.last-message p {
    line-height: 1.8;
}

.sign {
    width: 145px;
    max-width: 60%;
    margin-top: 15px;
}

.note {
    color: #998b93;
    font-size: 12px;
    margin-top: 20px;
    line-height: 1.7;
}

@media (max-width: 480px) {
    .container {
        padding: 22px 13px;
    }

    h1 {
        font-size: 24px;
    }

    .fortune {
        font-size: 35px;
    }

    .advice-grid {
        gap: 7px;
    }

    .advice-card {
        padding: 9px;
    }
}


/* おみくじを振る画面 */
#drawingScreen {
    display: none;
    margin-top: 25px;
    padding: 20px 10px;
    background: #e5f4ff;
    border-radius: 22px;
    overflow: hidden;
}

#drawingScreen h2 {
    color: #d85e91;
    font-size: 20px;
}

.shake-stage {
    position: relative;
    width: 100%;
    max-width: 300px;
    height: 370px;
    margin: 10px auto;
}

.shake-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.shake-one {
    animation: shakeOne 0.55s steps(1) infinite;
}

.shake-two {
    animation: shakeTwo 0.55s steps(1) infinite;
}

@keyframes shakeOne {
    0%, 49% {
        opacity: 1;
    }
    50%, 100% {
        opacity: 0;
    }
}

@keyframes shakeTwo {
    0%, 49% {
        opacity: 0;
    }
    50%, 100% {
        opacity: 1;
    }
}

.shake-message {
    color: #d85e91;
    font-size: 22px;
    font-weight: bold;
    animation: messageBounce 0.5s ease-in-out infinite alternate;
}

@keyframes messageBounce {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.08);
    }
}

.is-hidden {
    display: none !important;
}
/* 結果画像の保存・共有ボタン */
.result-actions {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin: 20px auto 8px;
}

.result-actions button {
    font-size: 15px;
    padding: 13px 22px;
}

@media (max-width: 480px) {
    .result-actions {
        flex-direction: column;
        align-items: stretch;
    }
}


</style>
</head>

    const random = Math.random() * 100;
    let total = 0;

    for (const fortune of fortunes) {
        total += fortune.probability;

        if (random < total) {
            return fortune.name;
        }
    }

    return "大凶";
}


// ===================================
// 9. おみくじ番号
// ===================================

function getFortuneNumber(fortuneName) {
    const index = fortunes.findIndex(f => f.name === fortuneName);

    const startNumber = fortunes
        .slice(0, index)
        .reduce((sum, f) => sum + 100, 0);

    const number = startNumber + Math.floor(Math.random() * 100) + 1;

    return String(number).padStart(3, "0");
}

// ===================================
// 11. かわいいガラガラ音を作る
// ===================================

let audioContext;
let rattleSources = [];
let rattleMasterGain;

function playRattleSound() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    audioContext.resume();

    const now = audioContext.currentTime;
    rattleSources = [];

    // 全体の音量
    rattleMasterGain = audioContext.createGain();
    rattleMasterGain.gain.setValueAtTime(5.0, now);
    rattleMasterGain.connect(audioContext.destination);

    const sampleRate = audioContext.sampleRate;

    // カラカラ・コロコロという音
    for (let i = 0; i < 18; i++) {
    const hitTime = now + i * 0.14 + Math.random() * 0.04;
        const hitDuration = 0.04 + Math.random() * 0.035;

        const buffer = audioContext.createBuffer(
            1,
            Math.floor(sampleRate * hitDuration),
            sampleRate
        );

        const data = buffer.getChannelData(0);

        for (let j = 0; j < data.length; j++) {
            const fade = Math.pow(1 - j / data.length, 2.5);
            data[j] = (Math.random() * 2 - 1) * fade;
        }

        const source = audioContext.createBufferSource();
        source.buffer = buffer;

        const filter = audioContext.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1100 + Math.random() * 900;
        filter.Q.value = 1.2;

        const volume = audioContext.createGain();
        const strength = 1.0 + Math.random() * 0.5;

        volume.gain.setValueAtTime(0.0001, hitTime);
        volume.gain.linearRampToValueAtTime(
            1.5 * strength,
            hitTime + 0.008
        );
        volume.gain.exponentialRampToValueAtTime(
            0.0001,
            hitTime + hitDuration
        );

        source.connect(filter);
        filter.connect(volume);
        volume.connect(rattleMasterGain);

        source.start(hitTime);
        source.stop(hitTime + hitDuration);

        rattleSources.push(source);
    }

    setTimeout(stopRattleSound, 2500);
}

// 音を止める
function stopRattleSound() {
    if (!audioContext || !rattleMasterGain) return;

    const now = audioContext.currentTime;

    rattleMasterGain.gain.cancelScheduledValues(now);
    rattleMasterGain.gain.setValueAtTime(
        rattleMasterGain.gain.value,
        now
    );
    rattleMasterGain.gain.linearRampToValueAtTime(0, now + 0.015);

    rattleSources.forEach(source => {
        try {
            source.stop(now + 0.015);
        } catch (e) {
            // 停止済みの場合は何もしない
        }
    });

    rattleSources = [];
}

// 結果画像を作る機能
// ===================================

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
    let line = "";

    for (const char of Array.from(String(text ?? ""))) {
        if (ctx.measureText(line + char).width > maxWidth && line) {
            ctx.fillText(line, x, y);
            line = char;
            y += lineHeight;
        } else {
            line += char;
        }
    }

    if (line) {
        ctx.fillText(line, x, y);
        y += lineHeight;
    }

    return y;
}


function roundedRect(ctx, x, y, width, height, radius, fill, stroke) {
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, radius);
    ctx.fillStyle = fill;
    ctx.fill();

    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}


// 結果画像を作成する
function createFortuneCanvas() {

    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (!data) {
        throw new Error("おみくじの結果が見つかりません。");
    }

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const width = 1080;
    const pad = 70;
    const contentWidth = width - pad * 2;

    ctx.font = "32px sans-serif";

    function countLines(text, maxWidth) {
        let lines = 1;
        let line = "";

        for (const ch of Array.from(String(text ?? ""))) {
            if (ctx.measureText(line + ch).width > maxWidth && line) {
                lines++;
                line = ch;
            } else {
                line += ch;
            }
        }

        return lines;
    }

    let height = 1100;

    height += data.advice.reduce(
        (sum, item) =>
            sum + 140 + countLines(item.message, contentWidth - 56) * 45,
        0
    );

    height += (
        countLines(data.message, contentWidth - 60) +
        countLines(data.lastMessage, contentWidth - 56)
    ) * 45;

    canvas.width = width;
    canvas.height = height;

    // 背景
    const gradient = ctx.createLinearGradient(0, 0, width, height);

    gradient.addColorStop(0, "#fff0f5");
    gradient.addColorStop(1, "#eaf4ff");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    roundedRect(
        ctx, 28, 28, width - 56, height - 56,
        38, "#fffdf9", "#e9a0b9"
    );

    let y = 115;

    // タイトル
    ctx.textAlign = "center";
    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 54px sans-serif";
    ctx.fillText("うぱくんのおみくじ", width / 2, y);

    y += 65;

    ctx.fillStyle = "#9c8290";
    ctx.font = "30px sans-serif";
    ctx.fillText("第" + data.number + "番", width / 2, y);

    y += 90;

    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 88px sans-serif";
    ctx.fillText(data.fortune, width / 2, y);

    y += 80;

    // 総合運
    const messageLines = countLines(data.message, contentWidth - 60);

    roundedRect(
        ctx, pad, y, contentWidth,
        95 + messageLines * 42,
        24, "#fff0f5", "#f0c6d5"
    );

    y += 55;

    ctx.textAlign = "left";
    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 34px sans-serif";
    ctx.fillText("🌸 総合運", pad + 28, y);

    y += 48;

    ctx.fillStyle = "#443b48";
    ctx.font = "30px sans-serif";

    y = drawWrappedText(
        ctx, data.message,
        pad + 28, y,
        contentWidth - 56, 42
    ) + 45;

    // それぞれの運勢
    ctx.textAlign = "center";
    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 38px sans-serif";
    ctx.fillText("🌷 それぞれの運勢", width / 2, y);

    y += 35;

    for (const item of data.advice) {

        const lines = countLines(item.message, contentWidth - 56);
        const cardHeight = 82 + lines * 42;

        roundedRect(
            ctx, pad, y, contentWidth,
            cardHeight, 20, "#ffffff", "#f0c6d5"
        );

        ctx.textAlign = "left";
        ctx.fillStyle = "#d85e91";
        ctx.font = "bold 31px sans-serif";
        ctx.fillText(item.name, pad + 28, y + 48);

        ctx.fillStyle = "#443b48";
        ctx.font = "28px sans-serif";

        drawWrappedText(
            ctx, item.message,
            pad + 28, y + 92,
            contentWidth - 56, 39
        );

        y += cardHeight + 15;
    }

    // ラッキー情報
    y += 15;

    ctx.textAlign = "center";
    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 38px sans-serif";
    ctx.fillText("🎁 今日のラッキー", width / 2, y);

    y += 55;

    roundedRect(
        ctx, pad, y, contentWidth, 125,
        22, "#fff0f5", "#f0c6d5"
    );

    ctx.textAlign = "left";
    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 29px sans-serif";
    ctx.fillText("ラッキーカラー", pad + 28, y + 43);

    ctx.fillStyle = "#443b48";
    ctx.font = "29px sans-serif";
    ctx.fillText(data.luckyColor.name, pad + 340, y + 43);

    ctx.fillStyle = data.luckyColor.code || "#ffffff";
    ctx.beginPath();
    ctx.arc(pad + 295, y + 35, 17, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#d0c5cb";
    ctx.stroke();

    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 29px sans-serif";
    ctx.fillText("ラッキーアイテム", pad + 28, y + 94);

    ctx.fillStyle = "#443b48";
    ctx.font = "29px sans-serif";
    ctx.fillText(data.luckyItem.name, pad + 340, y + 94);

    y += 165;

    // 最後の一言
    const lastLines = countLines(data.lastMessage, contentWidth - 56);

    roundedRect(
        ctx, pad, y, contentWidth,
        100 + lastLines * 42,
        22, "#ffe8f0", "#f0c6d5"
    );

    ctx.textAlign = "left";
    ctx.fillStyle = "#d85e91";
    ctx.font = "bold 31px sans-serif";
    ctx.fillText("うぱくんから最後の一言", pad + 28, y + 48);

    ctx.fillStyle = "#443b48";
    ctx.font = "29px sans-serif";

    drawWrappedText(
        ctx, data.lastMessage,
        pad + 28, y + 98,
        contentWidth - 56, 40
    );

    ctx.textAlign = "center";
    ctx.fillStyle = "#a18f99";
    ctx.font = "24px sans-serif";
    ctx.fillText(
        "今日も素敵な一日になりますように！",
        width / 2, height - 65
    );

    return canvas;
}


// CanvasをPNG画像に変換
async function makeResultImageBlob() {

    const canvas = createFortuneCanvas();

    return await new Promise(resolve => {
        canvas.toBlob(resolve, "image/png");
    });
}


// 画像を保存
async function saveFortuneImage() {

    const button = document.getElementById("saveResultButton");
    button.disabled = true;

    try {

        const blob = await makeResultImageBlob();

        if (!blob) {
            throw new Error("画像を作成できませんでした。");
        }

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "うぱくんのおみくじ結果.png";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

    } catch (error) {

        console.error(error);
        alert("画像を保存できませんでした。");

    } finally {

        button.disabled = false;

    }
}


// 画像を共有
async function shareFortuneImage() {

    const button = document.getElementById("shareResultButton");
    button.disabled = true;

    try {

        const blob = await makeResultImageBlob();

        if (!blob) {
            throw new Error("画像を作成できませんでした。");
        }

        const file = new File(
            [blob],
            "うぱくんのおみくじ結果.png",
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {

            await navigator.share({
                title: "うぱくんのおみくじ",
                text: "今日のおみくじ結果だよ！",
                files: [file]
            });

        } else {

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "うぱくんのおみくじ結果.png";

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);

            alert(
                "画像を保存したよ！LINE・Instagram・Xに添付して共有してね！"
            );

        }

    } catch (error) {

        if (error.name !== "AbortError") {
            console.error(error);
            alert("共有できませんでした。");
        }

    } finally {

        button.disabled = false;

    }
}


// ボタンに機能を設定
document.getElementById("saveResultButton")
    .addEventListener("click", saveFortuneImage);

document.getElementById("shareResultButton")
    .addEventListener("click", shareFortuneImage);


// ===================================
// 13. おみくじを引く処理
// ===================================

const STORAGE_KEY = "upakun_omikuji_result_v1";

document.getElementById("drawButton").addEventListener("click", function() {

    if (this.disabled) return;

    this.disabled = true;

    // 最初の画面を隠す
    hideStartScreen();

    // 振っている画面を表示
    document.getElementById("drawingScreen").style.display = "block";

    // ガラガラ音を鳴らす
    playRattleSound();

    // 抽選結果を決める
   const fortune = drawFortune();

const isError = (
    !Array.isArray(fortuneMessages[fortune]) ||
    fortuneMessages[fortune].length === 0 ||
    adviceCategories.some(category =>
        !Array.isArray(adviceMessages[fortune]?.[category.key]) ||
        adviceMessages[fortune][category.key].length === 0
    )
);

const result = {

    fortune: fortune,

    number: getFortuneNumber(fortune),

    message: randomChoice(
        isError ? errorFortuneMessages : fortuneMessages[fortune]
    ),

    advice: adviceCategories.map(category => ({
        name: category.name,
        message: randomChoice(
            isError
                ? errorAdviceMessages[category.key]
                : adviceMessages[fortune][category.key]
        )
    })),

    luckyColor: randomChoice(luckyColors),

    luckyItem: randomChoice(luckyItems),

    lastMessage: randomChoice(
        isError ? errorLastMessages : lastMessages
    )

};

    // 2.5秒後に結果を表示

    setTimeout(function() {
    stopRattleSound();
    document.getElementById("drawingScreen").style.display = "none";
    

        // 結果を保存
        localStorage.setItem(STORAGE_KEY, JSON.stringify(result));

        // 結果を表示
        showResult(result);

    }, 2500);

});


// ===================================
// 14. 保存された結果を確認
// ===================================

const savedResult = localStorage.getItem(STORAGE_KEY);

if (savedResult) {

    // 最初の画面を隠す
    hideStartScreen();

    // 保存された結果を表示
    showResult(JSON.parse(savedResult));

}
